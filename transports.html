<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transit — Scheduled services</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="board-header">
    <div class="wrap">
      <div class="brand">
        <span class="flap">▣</span> Transit
        <span class="sub">AIRLINE · BUS · TRAIN BOOKING</span>
      </div>
      <nav class="board-nav">
        <a href="index.html">Search</a>
        <a href="ticket.html">My ticket</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="flow-breadcrumb" id="breadcrumb"></div>
      <h1 id="pageTitle">Scheduled services</h1>
      <p class="lede">Pick a departure, then choose your seat.</p>

      <div class="search-panel">
        <div class="search-grid">
          <div class="field">
            <label for="source">From</label>
            <input type="text" id="source" placeholder="Any origin" />
          </div>
          <div class="field">
            <label for="destination">To</label>
            <input type="text" id="destination" placeholder="Any destination" />
          </div>
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" />
          </div>
          <button type="button" class="btn-amber" id="filterBtn">Filter</button>
        </div>
      </div>

      <div id="resultsArea">
        <div class="board-list-head">
          <span>Service</span>
          <span>Route</span>
          <span>Departs</span>
          <span>Arrives</span>
          <span>Fare</span>
          <span>Seats</span>
          <span></span>
        </div>
        <div id="resultsList"></div>
      </div>
    </div>
  </main>

  <footer>Transit Ticket Booking System — demo project, not a real booking service.</footer>

  <script src="js/api.js"></script>
  <script src="js/transports.js"></script>
</body>
</html>
